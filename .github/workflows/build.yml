name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Bootstrap Android platform
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name=midad --org=com.midad /tmp/boot
            cp -r /tmp/boot/android ./android
            # Patch compileSdk and Kotlin for flutter_tts compatibility
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle 2>/dev/null || true
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle 2>/dev/null || true
            sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' android/app/build.gradle 2>/dev/null || true
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "2.0.20"/' android/build.gradle 2>/dev/null || true
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
